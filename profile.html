<!doctype html>
<html lang="id">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/x-icon" href="assets/img/logo.png" />
      <title>Edit Profil - DPMPTSP</title>
      <link rel="stylesheet" href="assets/css/style.css" />
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
   </head>
   <body>
      <header class="navbar">
         <div class="container">
            <div class="logo">
               <img src="assets/img/logo.png" alt="Logo DPMPTSP" style="height: 40px" />
            </div>
            <div class="user-profile-nav">
               <div class="notification-wrapper" style="position: relative; display: flex; align-items: center">
                  <i id="notifTrigger" class="fa-regular fa-bell" style="font-size: 1.6rem; cursor: pointer; color: white; margin-top: 4px"></i>
                  <span id="unreadBadge" class="unread-badge"></span>

                  <div class="notification-dropdown" id="notifDropdown">
                     <div class="dropdown-body">
                        <a href="#" class="notif-item unread">
                           <div class="notif-content">
                              <strong>Verifikator</strong>
                              <p>Permohonan izin Anda telah diterima dan sedang diproses.</p>
                              <span class="notif-time">2 jam yang lalu</span>
                           </div>
                           <span class="dot-indicator"></span>
                        </a>

                        <a href="#" class="notif-item">
                           <div class="notif-content">
                              <strong>Dinas Kesehatan</strong>
                              <p>Mohon lengkapi dokumen persyaratan Izin Apotek.</p>
                              <span class="notif-time">5 jam yang lalu</span>
                           </div>
                        </a>
                     </div>
                     <div class="dropdown-footer">
                        <a href="#">Lihat Semua Pesan</a>
                     </div>
                  </div>
               </div>

               <a href="home-pengaju.html" id="btnHomeLink">
                  <i class="fa-solid fa-house" style="font-size: 1.4rem; cursor: pointer; color: white"></i>
               </a>
            </div>
         </div>
      </header>

      <main class="container main-content">
         <h1>Edit Profil</h1>

         <div class="form-card">
            <form id="editProfileForm">
               <div class="form-group">
                  <label>NIK/KITAS/KITAP Pemohon</label>
                  <input type="text" id="editNIK" placeholder="NIK/KITAS/KITAP Pemohon" maxlength="16" required />
               </div>

               <div class="form-group">
                  <label>Nama Lengkap</label>
                  <input type="text" id="editNama" placeholder="Nama Lengkap" required />
               </div>

               <div class="form-group">
                  <label>Tempat Tanggal Lahir</label>
                  <input type="text" id="editTTL" placeholder="Tempat Tanggal Lahir" required />
               </div>

               <div class="form-group">
                  <label>Username</label>
                  <input type="text" id="editUsername" placeholder="Username" required />
               </div>

               <div class="form-group">
                  <label>Password</label>
                  <input type="password" id="editPassword" placeholder="Password" required />
               </div>

               <div class="form-footer">
                  <button type="button" class="btn-batal">Batal</button>
                  <button type="submit" class="btn-simpan">Simpan Perubahan</button>
               </div>
            </form>
         </div>
      </main>

      <script src="assets/js/script.js"></script>
   </body>
</html>
